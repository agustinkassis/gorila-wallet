# flat node_modules (like npm): the desktop app bundles the Next.js standalone server, which needs real directories
# (no symlinks in installers), short paths (Windows MAX_PATH) and one copy of React
nodeLinker: hoisted
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - better-sqlite3
  - prisma
  - "@prisma/engines"
